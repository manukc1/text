<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Общий текст</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e9eef3; --panel: #ffffff; --ink: #17202b; --muted: #5d6b7a;
    --line: #c9d3dd; --accent: #1f5fd6; --accent-ink: #ffffff; --bad: #b3261e; --ok: #1b7a43;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11171e; --panel: #1a222c; --ink: #e6ecf2; --muted: #93a1b0;
      --line: #2e3a47; --accent: #6b9bff; --accent-ink: #0c1420; --bad: #ff8a80; --ok: #6fd69a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.5 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  .wrap { width: 100%; max-width: 900px; margin: 0 auto; padding: 16px; flex: 1; display: flex; flex-direction: column; min-height: 0; }
  h1 { font-size: 1.25rem; margin: 0 0 4px; font-weight: 600; }
  p.hint { margin: 0 0 16px; color: var(--muted); max-width: 60ch; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
  #join { margin: auto 0; }
  label { display: block; font-weight: 600; margin-bottom: 8px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=text] {
    font: 600 1.6rem "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .2em; text-align: center;
    width: 5.5ch; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--ink);
  }
  button {
    font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--accent);
    background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #err { color: var(--bad); min-height: 1.5em; margin: 8px 0 0; }
  #app { display: none; flex: 1; flex-direction: column; min-height: 0; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .room { font-weight: 600; }
  .room b { font-family: "IBM Plex Mono", ui-monospace, monospace; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }
  #status { color: var(--muted); font-size: .9rem; }
  #status.ok { color: var(--ok); } #status.bad { color: var(--bad); }
  textarea {
    flex: 1; min-height: 50vh; width: 100%; resize: none; padding: 14px;
    font: 1rem/1.55 "IBM Plex Mono", ui-monospace, monospace;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 10px;
  }
  .foot { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin-top: 10px; color: var(--muted); font-size: .9rem; }
  #count.bad { color: var(--bad); font-weight: 600; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <section id="join" class="card">
    <h1>Общий текст</h1>
    <p class="hint">Введите двузначный код (число дня, в который вы работаете). Все, кто введёт тот же код, видят один и тот же текст.</p>
    <label for="code">Код</label>
    <div class="row">
      <input id="code" type="text" inputmode="numeric" maxlength="2" autocomplete="off" placeholder="00">
      <button id="go">Войти</button>
    </div>
    <p id="err" role="alert"></p>
  </section>

  <section id="app">
    <div class="bar">
      <div class="room">Код: <b id="room"></b></div>
      <div class="row">
        <span id="status">Подключение…</span>
        <button class="ghost" id="copy">Копировать</button>
        <button class="ghost" id="clear">Очистить</button>
        <button class="ghost" id="leave">Сменить код</button>
      </div>
    </div>
    <textarea id="text" placeholder="Пишите здесь — текст появится на всех устройствах с этим кодом" spellcheck="false"></textarea>
    <div class="foot">
      <span>Текст хранится на сервере около 12 часов.</span>
      <span id="count">0 / 3500</span>
    </div>
  </section>
</div>

<script>
(function () {
  var BASE = "https://ntfy.sh/";
  var PREFIX = "gh-textsync-k7q2-";   // при желании замените на свою уникальную строку
  var MAX_BYTES = 3500;
  var clientId = Math.random().toString(36).slice(2);
  var es = null, lastTime = 0, timer = null, lastSent = null, topic = "";

  var $ = function (id) { return document.getElementById(id); };
  var codeEl = $("code"), errEl = $("err"), textEl = $("text"), statusEl = $("status"), countEl = $("count");

  function setStatus(msg, cls) { statusEl.textContent = msg; statusEl.className = cls || ""; }
  function bytes(s) { return new TextEncoder().encode(s).length; }

  function updateCount() {
    var n = bytes(textEl.value);
    countEl.textContent = n + " / " + MAX_BYTES + " байт";
    countEl.className = n > MAX_BYTES ? "bad" : "";
    return n <= MAX_BYTES;
  }

  function join() {
    var code = codeEl.value.trim();
    if (!/^\d{2}$/.test(code)) { errEl.textContent = "Нужны ровно две цифры, например 13."; return; }
    errEl.textContent = "";
    try { localStorage.setItem("textsync-code", code); } catch (e) {}
    topic = PREFIX + code;
    $("room").textContent = code;
    $("join").style.display = "none";
    $("app").style.display = "flex";
    textEl.value = ""; lastTime = 0; lastSent = null;
    updateCount();
    connect();
    textEl.focus();
  }

  function connect() {
    if (es) es.close();
    setStatus("Подключение…");
    es = new EventSource(BASE + topic + "/sse?since=all");
    es.onopen = function () { setStatus("Подключено", "ok"); };
    es.onerror = function () { setStatus("Нет связи, переподключаюсь…", "bad"); };
    es.onmessage = function (ev) {
      var d;
      try { d = JSON.parse(ev.data); } catch (e) { return; }
      if (!d || d.event !== "message" || !d.message) return;
      var m;
      try { m = JSON.parse(d.message); } catch (e) { return; }
      if (m.c === clientId) return;
      if (d.time < lastTime) return;
      lastTime = d.time;
      applyRemote(m.t || "");
    };
  }

  function applyRemote(t) {
    if (t === textEl.value) return;
    var s = textEl.selectionStart, e = textEl.selectionEnd;
    textEl.value = t;
    lastSent = t;
    try { textEl.setSelectionRange(Math.min(s, t.length), Math.min(e, t.length)); } catch (x) {}
    updateCount();
  }

  function send() {
    var t = textEl.value;
    if (t === lastSent || !updateCount()) return;
    lastSent = t;
    fetch(BASE + topic, { method: "POST", body: JSON.stringify({ c: clientId, t: t }) })
      .then(function (r) { if (!r.ok) throw new Error(r.status); setStatus("Подключено", "ok"); })
      .catch(function () { setStatus("Не удалось отправить", "bad"); lastSent = null; });
  }

  textEl.addEventListener("input", function () {
    updateCount();
    clearTimeout(timer);
    timer = setTimeout(send, 700);
  });

  $("go").addEventListener("click", join);
  codeEl.addEventListener("keydown", function (e) { if (e.key === "Enter") join(); });
  codeEl.addEventListener("input", function () { codeEl.value = codeEl.value.replace(/\D/g, "").slice(0, 2); });
  $("leave").addEventListener("click", function () {
    if (es) es.close();
    $("app").style.display = "none"; $("join").style.display = "";
    codeEl.focus();
  });
  $("clear").addEventListener("click", function () {
    if (!textEl.value || confirm("Очистить текст на всех устройствах?")) {
      textEl.value = ""; updateCount(); send();
    }
  });
  $("copy").addEventListener("click", function () {
    var done = function () { setStatus("Скопировано", "ok"); };
    if (navigator.clipboard) navigator.clipboard.writeText(textEl.value).then(done);
    else { textEl.select(); document.execCommand("copy"); done(); }
  });

  // Подсказка: число сегодняшнего дня
  var saved = ""; try { saved = localStorage.getItem("textsync-code") || ""; } catch (e) {}
  codeEl.value = saved || String(new Date().getDate()).padStart(2, "0");
})();
</script>
</body>
</html>
